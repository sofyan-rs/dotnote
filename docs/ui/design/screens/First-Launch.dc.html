<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dotnote · Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="flex: 1; padding: 112px 24px 0 24px; display: flex; flex-direction: column; gap: 32px">
    <div role="img" aria-label="A note" style="display: grid; grid-template-columns: repeat(9, 8px); grid-auto-rows: 8px; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="99">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: {{d.bg}}; opacity: {{d.op}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: Doto, 'Space Mono', monospace; font-size: 32px; line-height: 36px; font-weight: 700">DOTNOTE</span>
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">Markdown notes in a folder you own.</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6a6a6">No account, no database. Pick a folder and every note stays a plain .md file you can open anywhere.</p>
    </div>
  </div>

  <div style="padding: 0 16px 32px 16px; display: flex; flex-direction: column; gap: 8px">
    <a href="Open-Folder.dc.html" style="height: 56px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>
      Open a folder
    </a>
    <a href="Git-Sync.dc.html" style="height: 56px; border-radius: 999px; border: 1.5px solid #6b6b6b; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-6 4-12 8"/></svg>
      Clone from git
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
'XXXXXX...',
'X....XX..',
'X....X.X.',
'X....XXXX',
'X.......X',
'X.XXXX..X',
'X.......X',
'X.XXXXX.X',
'X.......X',
'X.XXR...X',
'XXXXXXXXX'
];
const dots = [];
rows.forEach((r) => {
for (const c of r) {
if (c === 'X') dots.push({ bg: '#ffffff', op: 1 });
else if (c === 'R') dots.push({ bg: '#e5211c', op: 1 });
else dots.push({ bg: '#6b6b6b', op: 0.5 });
}
});
return { dots };
}
}
</script>
</body>
</html>
