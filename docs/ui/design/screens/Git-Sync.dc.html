<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KuNotes · Git sync</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 48px 16px 0 16px; min-height: 48px; display: flex; align-items: center">
    <span style="font-family: Doto, 'Space Mono', monospace; font-size: 32px; line-height: 36px; font-weight: 700">SYNC</span>
  </header>

  <div style="padding: 32px 16px 0 16px; display: flex; flex-direction: column; gap: 24px">
    <section style="background: #111111; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6">LAST SYNC</span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 13px; color: #4ad991">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Up to date</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: Doto, 'Space Mono', monospace; font-size: 72px; line-height: 72px; font-weight: 900; letter-spacing: -0.02em">2</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 13px; color: #a6a6a6">MIN AGO</span>
      </div>
      <div style="display: flex; gap: 8px; font-family: 'Space Mono', monospace; font-size: 13px; line-height: 18px; color: #a6a6a6">
        <span>main</span><span>·</span><span>3 files pushed</span><span>·</span><span>0 pulled</span>
      </div>
      <button type="button" style="height: 48px; border: 0; border-radius: 999px; background: #ffffff; color: #000000; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5"/></svg>
        Sync now
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #808080">REPOSITORY</div>
      <div style="background: #111111; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
        <button type="button" style="min-height: 64px; border: 0; border-bottom: 1px solid #262626; background: none; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 24px; font-weight: 500">Remote</span>
            <span style="font-family: 'Space Mono', monospace; font-size: 13px; line-height: 18px; color: #a6a6a6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">github.com/sofyan-rs/notes.git</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" style="min-height: 56px; border: 0; border-bottom: 1px solid #262626; background: none; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
          <span style="flex: 1; font-size: 17px; font-weight: 500">Sign-in</span>
          <span style="font-family: 'Space Mono', monospace; font-size: 13px; color: #a6a6a6">Access token</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div style="min-height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 24px; font-weight: 500">Auto-sync</span>
            <span style="font-size: 13px; line-height: 18px; color: #a6a6a6">After edits and when you open the app</span>
          </span>
          <button type="button" role="switch" aria-checked="{{autoChecked}}" aria-label="Auto-sync" onClick="{{toggle}}" style="flex: none; width: 52px; height: 32px; border-radius: 999px; border: 1.5px solid {{trackBorder}}; background: {{trackBg}}; padding: 0; position: relative; cursor: pointer; transition: background 140ms ease">
            <span style="position: absolute; top: 3px; left: {{thumbLeft}}; width: 23px; height: 23px; border-radius: 999px; background: {{thumbBg}}; transition: left 140ms ease"></span>
          </button>
        </div>
      </div>
    </section>

    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #a6a6a6">A note changed on two devices keeps both versions, so nothing is overwritten.</p>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; box-sizing: border-box; padding-bottom: 16px; background: #000000; border-top: 1px solid #262626; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #808080">
      <span style="width: 4px; height: 4px"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">FILES</span>
    </a>
    <a href="Quick-Switcher.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #808080">
      <span style="width: 4px; height: 4px"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">SEARCH</span>
    </a>
    <a href="Git-Sync.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #ffffff">
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #e5211c"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-6 4-12 8"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">SYNC</span>
    </a>
    <a href="Vaults.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #808080">
      <span style="width: 4px; height: 4px"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">VAULTS</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { auto: true };
}
renderVals() {
const on = this.state.auto;
return {
autoChecked: on ? 'true' : 'false',
toggle: () => this.setState({ auto: !this.state.auto }),
trackBg: on ? '#e5211c' : '#1c1c1c',
trackBorder: on ? '#e5211c' : '#6b6b6b',
thumbBg: on ? '#ffffff' : '#a6a6a6',
thumbLeft: on ? '23px' : '3px'
};
}
}
</script>
</body>
</html>
