<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KuNotes · Empty vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 48px 16px 0 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Vault-Switcher.dc.html" aria-label="Switch vault" style="display: flex; align-items: center; gap: 8px; min-height: 48px; text-decoration: none; color: #ffffff">
        <span style="font-family: Doto, 'Space Mono', monospace; font-size: 32px; line-height: 36px; font-weight: 700">NOTES</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </div>
    <span style="font-family: 'Space Mono', monospace; font-size: 13px; line-height: 18px; color: #a6a6a6">Documents/Notes · 0 notes</span>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 32px 120px 32px; text-align: center">
    <div role="img" aria-label="Empty folder" style="display: grid; grid-template-columns: repeat(11, 8px); grid-auto-rows: 8px; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="88">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: {{d.bg}}; opacity: {{d.op}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">No notes yet</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6a6a6">Write your first note, or add .md files to this folder from another app. They show up here on their own.</p>
    </div>
    <div style="display: flex; gap: 8px">
      <a href="New-Item.dc.html" style="height: 48px; padding: 0 20px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New note</a>
      <a href="New-Item.dc.html" style="height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #6b6b6b; color: #ffffff; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 500">New folder</a>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; box-sizing: border-box; padding-bottom: 16px; background: #000000; border-top: 1px solid #262626; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #ffffff">
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #e5211c"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">FILES</span>
    </a>
    <a href="Quick-Switcher.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #808080">
      <span style="width: 4px; height: 4px"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">SEARCH</span>
    </a>
    <a href="Git-Sync.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #808080">
      <span style="width: 4px; height: 4px"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-6 4-12 8"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">SYNC</span>
    </a>
    <a href="Vaults.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #808080">
      <span style="width: 4px; height: 4px"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em">VAULTS</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
'XXXX.......',
'X...X......',
'X....XXXXXX',
'X.........X',
'X.........X',
'X.........X',
'X.........X',
'XXXXXXXXXXX'
];
const dots = [];
rows.forEach((r) => {
for (const c of r) {
dots.push(c === 'X' ? { bg: '#ffffff', op: 1 } : { bg: '#6b6b6b', op: 0.5 });
}
});
return { dots };
}
}
</script>
</body>
</html>
