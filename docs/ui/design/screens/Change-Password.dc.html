</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 40px 4px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="Vault-Actions.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ffffff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #a6a6a6">VAULT · WORK</span>
  </header>

  <div style="flex: 1; padding: 24px 16px 0 16px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">Change notes password</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6a6a6">Your 3 locked notes stay locked. Only the password that opens them changes.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cp-current" style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6">CURRENT PASSWORD</label>
        <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #e5211c">
          <input id="cp-current" type="password" value="wrongpass" aria-invalid="true" aria-describedby="cp-err" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Mono', monospace; font-size: 17px; letter-spacing: 0.12em">
        </div>
        <span id="cp-err" style="font-size: 13px; line-height: 18px; color: #ff5a52">That's not the current password. Try again.</span>
      </div>

      <span style="height: 1px; background: #262626; margin: 4px 0"></span>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cp-new" style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6">NEW PASSWORD</label>
        <div style="display: flex; align-items: center; height: 56px; padding: 0 4px 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #6b6b6b">
          <input id="cp-new" type="password" value="battery-staple-42" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Mono', monospace; font-size: 17px; letter-spacing: 0.12em">
          <button type="button" aria-label="Show password" style="width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #a6a6a6; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cp-confirm" style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6">CONFIRM NEW PASSWORD</label>
        <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #6b6b6b">
          <input id="cp-confirm" type="password" value="battery-staple-42" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Mono', monospace; font-size: 17px; letter-spacing: 0.12em">
          <span style="display: flex; align-items: center; gap: 4px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #4ad991">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>MATCH</span>
        </div>
      </div>
    </form>

    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #a6a6a6">Other devices synced with this vault ask for the new password next time.</p>
  </div>

  <div style="padding: 0 16px 32px 16px">
    <a href="Vaults.dc.html" style="height: 56px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500">Change password</a>
  </div>
</div>
