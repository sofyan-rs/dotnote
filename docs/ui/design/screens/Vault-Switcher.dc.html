<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dotnote · Change vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif">

  <div aria-hidden="true" style="padding: 48px 16px 0 16px; display: flex; flex-direction: column; gap: 24px">
    <span style="font-family: Doto, 'Space Mono', monospace; font-size: 32px; line-height: 36px; font-weight: 700">PERSONAL</span>
    <div style="background: #111111; border-radius: 16px; height: 392px"></div>
  </div>

  <a href="Main.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.72)"></a>

  <section role="dialog" aria-label="Change vault" style="position: absolute; left: 0; right: 0; bottom: 0; background: #111111; border-radius: 28px 28px 0 0; padding: 12px 16px 32px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; display: flex; gap: 4px" aria-hidden="true">
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">Change vault</h1>
      <a href="Vaults.dc.html" style="height: 48px; display: flex; align-items: center; text-decoration: none; color: #a6a6a6; font-size: 15px">Manage</a>
    </div>

    <div role="radiogroup" aria-label="Vaults" style="background: #000000; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
      <sc-for list="{{vaults}}" as="v" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{v.checked}}" onClick="{{v.pick}}" style="min-height: 72px; border: 0; border-bottom: 1px solid #262626; background: {{v.rowBg}}; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18"/></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 24px; font-weight: 500">{{v.name}}</span>
            <span style="font-family: 'Space Mono', monospace; font-size: 13px; line-height: 18px; color: #a6a6a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.meta}}</span>
          </span>
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{v.ring}}; display: flex; align-items: center; justify-content: center">
            <span style="width: 12px; height: 12px; border-radius: 999px; background: {{v.dot}}"></span>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 48px; border: 1.5px solid #6b6b6b; border-radius: 999px; background: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>
        Open folder
      </button>
      <a href="Git-Sync.dc.html" style="height: 48px; border: 1.5px solid #6b6b6b; border-radius: 999px; text-decoration: none; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-6 4-12 8"/></svg>
        Clone repo
      </a>
    </div>

    <a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500">Open {{selectedName}}</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'personal' };
}
renderVals() {
const list = [
{ id: 'personal', name: 'Personal', meta: 'Documents/Personal · 9 notes' },
{ id: 'work', name: 'Work', meta: 'Synced from git · 41 notes' },
{ id: 'reading', name: 'Reading', meta: 'Download/Reading · 12 notes' }
];
const picked = this.state.picked;
const vaults = list.map((v) => {
const on = v.id === picked;
return {
name: v.name,
meta: v.meta,
checked: on ? 'true' : 'false',
rowBg: on ? '#1c1c1c' : 'transparent',
ring: on ? '#ffffff' : '#6b6b6b',
dot: on ? '#e5211c' : 'transparent',
pick: () => this.setState({ picked: v.id })
};
});
const sel = list.find((v) => v.id === picked);
return { vaults, selectedName: sel ? sel.name : '' };
}
}
</script>
</body>
</html>
