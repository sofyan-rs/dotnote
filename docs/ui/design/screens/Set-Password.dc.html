<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KuNotes · Set notes password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 40px 4px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="Note-Actions.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ffffff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #a6a6a6">VAULT · PERSONAL</span>
  </header>

  <div style="flex: 1; padding: 24px 16px 0 16px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">Set a notes password</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6a6a6">One password for every locked note in this vault. You'll need it to lock “Example”.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sp-new" style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6">PASSWORD</label>
        <div style="display: flex; align-items: center; height: 56px; padding: 0 4px 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #ffffff">
          <input id="sp-new" type="password" value="correct-horse-87" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Mono', monospace; font-size: 17px; letter-spacing: 0.12em">
          <button type="button" aria-label="Show password" style="width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #a6a6a6; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px">
          <div role="meter" aria-label="Password strength" aria-valuemin="0" aria-valuemax="12" aria-valuenow="9" style="display: flex; gap: 4px">
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #ffffff"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b; opacity: 0.5"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b; opacity: 0.5"></span>
            <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b; opacity: 0.5"></span>
          </div>
          <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #a6a6a6">STRONG · 16 CHARS</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sp-confirm" style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6">CONFIRM PASSWORD</label>
        <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #6b6b6b">
          <input id="sp-confirm" type="password" value="correct-horse-87" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Mono', monospace; font-size: 17px; letter-spacing: 0.12em">
          <span style="display: flex; align-items: center; gap: 4px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #4ad991">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>MATCH</span>
        </div>
      </div>

      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 15px">
        <input type="checkbox" checked="checked" style="width: 20px; height: 20px; margin: 0; accent-color: #ffffff">
        Unlock with fingerprint
      </label>
    </form>

    <div style="display: flex; gap: 12px; padding: 16px; border-radius: 16px; background: #111111">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff5a52" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #a6a6a6"><span style="color: #ffffff">There's no reset.</span> If you forget this password, locked notes can't be opened, here or on your computer.</p>
    </div>
  </div>

  <div style="padding: 0 16px 32px 16px">
    <a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="5" y="10" width="14" height="10"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Set password and lock
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

}

</body>
</html>
