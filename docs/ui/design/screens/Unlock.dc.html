<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dotnote · Locked note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 40px 4px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Back to files" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ffffff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 17px; line-height: 24px; font-weight: 500">Server Keys</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #808080">SERVER KEYS.MD.AGE</span>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 64px 24px 0 24px; gap: 32px">
    <div role="img" aria-label="Locked" style="display: grid; grid-template-columns: repeat(9, 8px); grid-auto-rows: 8px; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="81">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: {{d.bg}}; opacity: {{d.op}}"></span>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">This note is locked</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6a6a6; max-width: 300px">It's encrypted on disk. Enter the vault password to open it. It locks again after 5 minutes.</p>
    </div>

    <form style="align-self: stretch; display: flex; flex-direction: column; gap: 8px">
      <label for="pw" style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6">VAULT PASSWORD</label>
      <div style="display: flex; align-items: center; height: 56px; padding: 0 4px 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #6b6b6b">
        <input id="pw" type="password" value="hunter2hunter" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Mono', monospace; font-size: 17px; letter-spacing: 0.12em">
        <button type="button" aria-label="Show password" style="width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #a6a6a6; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 15px">
        <input type="checkbox" checked="checked" style="width: 20px; height: 20px; margin: 0; accent-color: #ffffff">
        Unlock with fingerprint next time
      </label>
    </form>
  </div>

  <div style="padding: 0 16px 32px 16px; display: flex; flex-direction: column; gap: 8px">
    <a href="Editor-Live.dc.html" style="height: 56px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 500">Unlock</a>
    <a href="Main.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #a6a6a6; font-size: 15px">Not now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
'...XXX...',
'..X...X..',
'..X...X..',
'.XXXXXXX.',
'.XXXXXXX.',
'.XXXRXXX.',
'.XXXRXXX.',
'.XXXXXXX.',
'.XXXXXXX.'
];
const dots = [];
rows.forEach((r) => {
for (const c of r) {
if (c === 'X') dots.push({ bg: '#ffffff', op: 1 });
else if (c === 'R') dots.push({ bg: '#e5211c', op: 1 });
else dots.push({ bg: '#6b6b6b', op: 0.5 });
}
});
return { dots };
}
}
</script>
</body>
</html>
