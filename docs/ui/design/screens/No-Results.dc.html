<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dotnote · No results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 48px 16px 0 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: Doto, 'Space Mono', monospace; font-size: 32px; line-height: 36px; font-weight: 700">SEARCH</span>
    <a href="Main.dc.html" aria-label="Close search" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ffffff; margin-right: -12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </header>

  <div style="padding: 24px 16px 0 16px">
    <label style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #ffffff">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find a note by name</span>
      <input type="search" value="budget" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 17px">
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #a6a6a6">0</span>
    </label>
  </div>

  <div style="padding: 48px 32px 0 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
    <div role="img" aria-label="Nothing found" style="display: grid; grid-template-columns: repeat(9, 6px); grid-auto-rows: 6px; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="81">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: {{d.bg}}; opacity: {{d.op}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">No note named “budget”</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6a6a6">Search matches note names in this vault.</p>
    </div>
    <a href="Editor-Live.dc.html" style="height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #6b6b6b; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Create note “budget”
    </a>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 290px; background: #111111; border-top: 1px solid #262626; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #6b6b6b">SYSTEM KEYBOARD</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
'..XXXX...',
'.X....X..',
'X......X.',
'X......X.',
'X......X.',
'.X....X..',
'..XXXXX..',
'......XX.',
'.......XX'
];
const dots = [];
rows.forEach((r) => {
for (const c of r) {
dots.push(c === 'X' ? { bg: '#ffffff', op: 1 } : { bg: '#6b6b6b', op: 0.5 });
}
});
return { dots };
}
}
</script>
</body>
</html>
