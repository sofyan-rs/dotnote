<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dotnote · Move to folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 40px 4px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="Note-Actions.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ffffff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #a6a6a6">MOVE · EXAMPLE.MD</span>
  </header>

  <div style="flex: 1; padding: 24px 16px 0 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">Move to folder</h1>
      <span style="font-size: 13px; line-height: 18px; color: #a6a6a6">Now in /Personal</span>
    </div>

    <div role="radiogroup" aria-label="Destination folder" style="background: #111111; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
      <sc-for list="{{folders}}" as="f" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{f.checked}}" disabled="{{f.disabled}}" onClick="{{f.pick}}" style="min-height: 56px; border: 0; border-bottom: 1px solid #262626; background: {{f.rowBg}}; padding: 0 16px 0 {{f.indent}}; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; color: {{f.ink}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>
          <span style="flex: 1; font-size: 17px; font-weight: 500">{{f.name}}</span>
          <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #808080">{{f.tag}}</span>
          <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{f.ring}}; display: flex; align-items: center; justify-content: center">
            <span style="width: 10px; height: 10px; border-radius: 999px; background: {{f.dot}}"></span>
          </span>
        </button>
      </sc-for>
      <a href="New-Item.dc.html" style="min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #a6a6a6">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-size: 15px">New folder</span>
      </a>
    </div>
  </div>

  <div style="padding: 0 16px 32px 16px">
    <a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500">Move to {{destName}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'projects' };
}
renderVals() {
const list = [
{ id: 'root', name: 'Personal', depth: 0, current: true },
{ id: 'journal', name: 'Journal', depth: 1 },
{ id: 'projects', name: 'Projects', depth: 1 },
{ id: 'archive', name: 'Archive', depth: 2 }
];
const picked = this.state.picked;
const folders = list.map((f) => {
const on = f.id === picked;
return {
name: f.name,
tag: f.current ? 'CURRENT' : '',
disabled: !!f.current,
checked: on ? 'true' : 'false',
indent: (16 + f.depth * 24) + 'px',
rowBg: on ? '#1c1c1c' : 'transparent',
ink: f.current ? '#808080' : '#ffffff',
ring: on ? '#ffffff' : (f.current ? '#262626' : '#6b6b6b'),
dot: on ? '#e5211c' : 'transparent',
pick: () => { if (!f.current) this.setState({ picked: f.id }); }
};
});
const sel = list.find((f) => f.id === picked);
return { folders, destName: sel ? sel.name : '' };
}
}
</script>
</body>
</html>
