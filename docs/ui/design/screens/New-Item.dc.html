<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KuNotes · New note or folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#a6a6a6}
button{font:inherit;color:inherit}
input::placeholder{color:#808080}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Space Grotesk', system-ui, sans-serif">

  <div aria-hidden="true" style="padding: 48px 16px 0 16px; display: flex; flex-direction: column; gap: 24px">
    <span style="font-family: Doto, 'Space Mono', monospace; font-size: 32px; line-height: 36px; font-weight: 700">PERSONAL</span>
    <div style="background: #111111; border-radius: 16px; height: 392px"></div>
  </div>

  <a href="Main.dc.html" aria-label="Cancel" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.72)"></a>

  <section role="dialog" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 290px; background: #111111; border-radius: 28px 28px 0 0; padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; display: flex; gap: 4px" aria-hidden="true">
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #6b6b6b"></span>
    </div>

    <div role="tablist" aria-label="What to create" style="padding: 4px; border-radius: 999px; background: #1c1c1c; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
      <button type="button" role="tab" aria-selected="{{noteSel}}" onClick="{{pickNote}}" style="height: 40px; border: 0; border-radius: 999px; background: {{noteBg}}; color: {{noteInk}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>NOTE</button>
      <button type="button" role="tab" aria-selected="{{folderSel}}" onClick="{{pickFolder}}" style="height: 40px; border: 0; border-radius: 999px; background: {{folderBg}}; color: {{folderInk}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>FOLDER</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">{{title}}</h1>
      <button type="button" aria-label="Change location" style="height: 48px; border: 0; background: none; display: flex; align-items: center; gap: 4px; padding: 0; font-family: 'Space Mono', monospace; font-size: 13px; color: #a6a6a6; cursor: pointer">
        In /Projects
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="newname" style="font-family: 'Space Mono', monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #a6a6a6; padding: 0 4px">NAME</label>
      <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; border-radius: 16px; background: #1c1c1c; border: 1.5px solid #ffffff">
        <input id="newname" type="text" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 17px; padding: 0">
        <sc-if value="{{isNote}}" hint-placeholder-val="{{true}}">
          <span style="font-family: 'Space Mono', monospace; font-size: 13px; color: #808080">.md</span>
        </sc-if>
      </div>
      <span style="font-size: 13px; line-height: 18px; color: #a6a6a6; padding: 0 4px">{{helper}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="Main.dc.html" style="height: 48px; border-radius: 999px; border: 1.5px solid #6b6b6b; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">Cancel</a>
      <a href="{{createHref}}" style="height: 48px; border-radius: 999px; background: #ffffff; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">Create</a>
    </div>
  </section>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 290px; background: #1c1c1c; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #6b6b6b">SYSTEM KEYBOARD</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["note","folder"],"default":"note"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: null };
}
renderVals() {
const kind = this.state.kind ?? this.props.kind ?? 'note';
const isNote = kind === 'note';
return {
isNote,
title: isNote ? 'New note' : 'New folder',
placeholder: isNote ? 'Untitled' : 'New folder',
helper: isNote ? 'Leave it empty to use “Untitled”. Opens in Live mode.' : 'Folders are real folders inside the vault.',
createHref: isNote ? 'Editor-Live.dc.html' : 'Main.dc.html',
noteSel: isNote ? 'true' : 'false',
folderSel: isNote ? 'false' : 'true',
noteBg: isNote ? '#ffffff' : 'transparent',
noteInk: isNote ? '#000000' : '#a6a6a6',
folderBg: isNote ? 'transparent' : '#ffffff',
folderInk: isNote ? '#a6a6a6' : '#000000',
pickNote: () => this.setState({ kind: 'note' }),
pickFolder: () => this.setState({ kind: 'folder' })
};
}
}
</script>
</body>
</html>
